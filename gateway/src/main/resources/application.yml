server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    # Token Bucket 알고리즘:
                    # - 버킷에 최대 burstCapacity(20)개의 토큰 보유
                    # - 요청마다 토큰 1개 소비, 토큰 없으면 429 반환
                    # - 매초 replenishRate(10)개씩 토큰 보충
                    # - 예: 순간 20개 요청 허용, 이후 초당 10개로 제한
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"

            - id: order-health
              uri: http://localhost:8082
              predicates:
                - Path=/health

  data:
    redis:
      host: localhost
      port: 6379
      username: kimmin2300
      password: kimmin2300

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

gateway:
  jwt:
    secret: dG95LXNlcnZlci1nYXRld2F5LXNlY3JldC1rZXktZm9yLWhtYWMtc2hhMjU2LW11c3QtYmUtMjU2LWJpdHM=
