server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"

            - id: order-health
              uri: http://localhost:8082
              predicates:
                - Path=/health

  data:
    redis:
      host: localhost
      port: 6379

gateway:
  jwt:
    secret: dG95LXNlcnZlci1nYXRld2F5LXNlY3JldC1rZXktZm9yLWhtYWMtc2hhMjU2LW11c3QtYmUtMjU2LWJpdHM=
    expiration: 3600000
