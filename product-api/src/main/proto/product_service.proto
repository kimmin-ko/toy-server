syntax = "proto3";

package study.min.product;

option java_multiple_files = true;
option java_package = "study.min.product.grpc";
option java_outer_classname = "ProductServiceProto";

/**
 * 상품 서비스 정의
 * - Order 서버에서 Product 서버로 gRPC 호출
 */
service ProductService {
  // 재고 확인
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);

  // 재고 차감 (주문 생성 시)
  rpc DecreaseStock(DecreaseStockRequest) returns (DecreaseStockResponse);

  // 재고 증가 (주문 취소 시)
  rpc IncreaseStock(IncreaseStockRequest) returns (IncreaseStockResponse);

  // 상품 정보 조회
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);

  // 여러 상품 정보 조회 (배치)
  rpc GetProducts(GetProductsRequest) returns (GetProductsResponse);
}

// ===== 재고 확인 =====
message CheckStockRequest {
  int64 product_id = 1;     // 상품 ID
  int32 quantity = 2;       // 확인할 수량
}

message CheckStockResponse {
  bool available = 1;           // 재고 충분 여부
  int32 current_stock = 2;      // 현재 재고
  string message = 3;           // 메시지 (예: "재고 충분", "재고 부족")
}

// ===== 재고 차감 =====
message DecreaseStockRequest {
  int64 product_id = 1;     // 상품 ID
  int32 quantity = 2;       // 차감할 수량
  string order_id = 3;      // 주문 ID (추적 및 로깅용)
}

message DecreaseStockResponse {
  bool success = 1;             // 성공 여부
  int32 remaining_stock = 2;    // 남은 재고
  string message = 3;           // 메시지
}

// ===== 재고 증가 =====
message IncreaseStockRequest {
  int64 product_id = 1;     // 상품 ID
  int32 quantity = 2;       // 증가할 수량
  string reason = 3;        // 사유 (예: "주문 취소", "반품", "입고")
}

message IncreaseStockResponse {
  bool success = 1;             // 성공 여부
  int32 remaining_stock = 2;    // 남은 재고
  string message = 3;           // 메시지
}

// ===== 상품 정보 조회 =====
message GetProductRequest {
  int64 product_id = 1;     // 상품 ID
}

message GetProductResponse {
  int64 id = 1;             // 상품 ID
  string name = 2;          // 상품명
  int64 price = 3;          // 가격
  int32 stock = 4;          // 재고
  bool available = 5;       // 구매 가능 여부
}

// ===== 여러 상품 정보 조회 =====
message GetProductsRequest {
  repeated int64 product_ids = 1;  // 상품 ID 목록
}

message GetProductsResponse {
  repeated ProductInfo products = 1;  // 상품 정보 목록
}

message ProductInfo {
  int64 id = 1;
  string name = 2;
  int64 price = 3;
  int32 stock = 4;
  bool available = 5;
}
