spring:
  application:
    name: order

  # Database
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: kimmin2300
    password: kimmin2300
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      username: kimmin2300
      password: kimmin2300
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # Virtual Thread
  threads:
    virtual:
      enabled: true

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

# Server
server:
  port: 8082
  shutdown: graceful

# gRPC
grpc:
  client:
    product-service:
      host: localhost
      port: 8091

# REST Client
rest:
  client:
    product-service:
      url: http://localhost:8081

# Logging
logging:
  level:
    root: INFO
    study.min: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
